<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Link</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .video-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #ff0000;
            font-weight: bold;
            text-decoration: none;
        }
        .video-link:hover {
            text-decoration: underline;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>YouTube Video Integration</h2>
        
        <!-- Method 1: Text Link -->
        <p>
            <a class="video-link" href="https://youtube.com" target="_blank" rel="noopener noreferrer">
                👉 Click here to watch the video on YouTube
            </a>
        </p>

        <!-- Method 2: Embedded Player -->
        <h3>Or watch it directly here:</h3>
        <div class="video-container">
            <iframe 
                src="https://youtube.com" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
